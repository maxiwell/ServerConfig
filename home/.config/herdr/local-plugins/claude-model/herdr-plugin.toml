id = "claude-model"
name = "Claude model"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Mostra o modelo ($model) e o contexto usado ($ctx) de cada painel do Claude na sidebar"
platforms = ["linux"]

[[startup]]
command = ["python3", "main.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "main.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "main.py"]

[[actions]]
id = "refresh"
title = "Claude model: atualizar"
description = "Mostra o modelo ($model) e o contexto usado ($ctx) de cada painel do Claude na sidebar"
contexts = ["global"]
command = ["python3", "main.py"]
